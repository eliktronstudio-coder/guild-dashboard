name: XD foundation
on:
  pull_request:
    paths: ['apps/web/**', '.github/workflows/xd-web.yml']
  push:
    branches: [main]
    paths: ['apps/web/**', '.github/workflows/xd-web.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: python3 scripts/check-telegram-http.py
      - run: python3 scripts/check-mini-app.py
