name: XD Timeweb operations
on:
  push:
    branches: [codex/xd-timeweb-inspect-20261109]
permissions:
  contents: read
concurrency:
  group: xd-timeweb-operations
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Enable adaptive TCP path MTU recovery and verify website health
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SSH_KEY: ${{ secrets.TIMEWEB_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: "200.165.236.194 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHI/yS3feBcn44XW5y4JDKep+SmRZlR2VxGcL6Rl8KDf"
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" || { echo 'Missing TIMEWEB_SSH_PRIVATE_KEY'; exit 1; }
          install -d -m 700 ~/.ssh
          trap 'rm -f ~/.ssh/xd_operations' EXIT
          printf '%s\n' "$SSH_KEY" > ~/.ssh/xd_operations
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/xd_operations ~/.ssh/known_hosts
          ssh -i ~/.ssh/xd_operations -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes root@200.165.236.194 'set -eu; systemctl is-active xd-guild; systemctl is-active xd-discord-bot; systemctl is-active xd-guild-deploy.timer; test "$(cat /var/lib/xd-guild-deploy/deployed)" = "$(cat /var/lib/xd-discord-bot/deployed)"; systemctl show xd-discord-bot --property=NRestarts; echo REFERENCE_UI_SERVICES_VERIFIED_NO_RECOGNITION'
          ssh -i ~/.ssh/xd_operations -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 root@200.165.236.194 'bash -se' <<'REMOTE'
          set -euo pipefail
          setting=/etc/sysctl.d/91-xd-tcp-path-mtu.conf
          before=$(sysctl -n net.ipv4.tcp_mtu_probing)
          case "$before" in 0|1|2) ;; *) exit 1 ;; esac
          backup=$(mktemp /root/xd-path-mtu-backup.XXXXXX)
          existed=0
          if [ -f "$setting" ]; then cp -p "$setting" "$backup"; existed=1; fi
          rollback() {
            sysctl -w "net.ipv4.tcp_mtu_probing=$before"
            if [ "$existed" = 1 ]; then cp -p "$backup" "$setting"; else rm -f "$setting"; fi
            echo PATH_MTU_CHANGE_ROLLED_BACK
          }
          trap rollback ERR
          install -d -m 755 /etc/sysctl.d
          printf '%s\n' '# Recover from TCP path MTU black holes only when retransmissions detect one.' 'net.ipv4.tcp_mtu_probing = 1' > "$setting"
          chmod 644 "$setting"
          sysctl -w net.ipv4.tcp_mtu_probing=1
          test "$(sysctl -n net.ipv4.tcp_mtu_probing)" = 1
          for version in 1.2 1.3; do
            curl --silent --show-error --fail --max-time 15 --tlsv"$version" --tls-max "$version" -o /dev/null -w "TLS_$version HTTP=%{http_code} TIME=%{time_total}\n" https://xd-guild.ru/login
          done
          systemctl is-active xd-guild
          systemctl is-active xd-discord-bot
          trap - ERR
          echo ADAPTIVE_PATH_MTU_ENABLED_NO_APPLICATION_OR_FINANCIAL_DATA_CHANGED
          REMOTE
