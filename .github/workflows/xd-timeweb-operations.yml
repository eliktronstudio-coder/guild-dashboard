name: XD Timeweb operations
on:
  push:
    branches: [codex/xd-timeweb-inspect-20261109]
permissions:
  contents: read
concurrency:
  group: xd-timeweb-operations
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Verify live activity workspace without changing data
        env:
          SSH_KEY: ${{ secrets.TIMEWEB_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: "200.165.236.194 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHI/yS3feBcn44XW5y4JDKep+SmRZlR2VxGcL6Rl8KDf"
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" || { echo 'Missing TIMEWEB_SSH_PRIVATE_KEY'; exit 1; }
          install -d -m 700 ~/.ssh
          trap 'rm -f ~/.ssh/xd_operations' EXIT
          printf '%s\n' "$SSH_KEY" > ~/.ssh/xd_operations
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/xd_operations ~/.ssh/known_hosts
          ssh -i ~/.ssh/xd_operations -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 root@200.165.236.194 'app=$(systemctl show xd-guild --property=WorkingDirectory --value); cd "$app"; node' <<'JS'
          require('@next/env').loadEnvConfig(process.cwd());
          (async()=>{
            if(process.env.APP_ORIGIN!=='https://xd-guild.ru')throw new Error('Unexpected origin');
            console.log('AUTH_FLAGS',JSON.stringify({email:process.env.AUTH_EMAIL_ENABLED,delivery:process.env.AUTH_EMAIL_DELIVERY_READY}));
            const r=await fetch(process.env.NEXT_PUBLIC_SUPABASE_URL+'/auth/v1/settings',{headers:{apikey:process.env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}});
            if(!r.ok)throw Error('Auth settings unavailable');
            const v=await r.json();console.log('PUBLIC_AUTH_SETTINGS',JSON.stringify({email:v.external?.email,disable_signup:v.disable_signup,mailer_autoconfirm:v.mailer_autoconfirm}));

          })().catch(()=>{console.error('Registry verification failed');process.exitCode=1;});
          JS
          ssh -i ~/.ssh/xd_operations -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes root@200.165.236.194 'systemctl is-active xd-guild; systemctl is-active xd-guild-deploy.timer; cat /var/lib/xd-guild-deploy/deployed'
