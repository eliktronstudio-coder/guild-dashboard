name: XD Timeweb operations
on:
  push:
    branches: [codex/xd-timeweb-inspect-20261109]
permissions:
  contents: read
concurrency:
  group: xd-timeweb-operations
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified additive activity schema and upload limit
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SSH_KEY: ${{ secrets.TIMEWEB_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: "200.165.236.194 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHI/yS3feBcn44XW5y4JDKep+SmRZlR2VxGcL6Rl8KDf"
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" || { echo 'Missing TIMEWEB_SSH_PRIVATE_KEY'; exit 1; }
          install -d -m 700 ~/.ssh
          trap 'rm -f ~/.ssh/xd_operations' EXIT
          printf '%s\n' "$SSH_KEY" > ~/.ssh/xd_operations
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/xd_operations ~/.ssh/known_hosts
          python3 operations/scripts/apply-activity-workspace.py
          ssh -i ~/.ssh/xd_operations -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes root@200.165.236.194 'python3 -' <<'PYREMOTE'
          from pathlib import Path
          import subprocess,datetime,re
          path=Path('/etc/nginx/sites-enabled/xd-guild.ru').resolve()
          content=path.read_text()
          assert '127.0.0.1:3001' in content and 'xd-guild.ru' in content
          if not re.search(r'client_max_body_size\s+8m\s*;',content):
              backup=path.with_name(path.name+'.backup-activity-'+datetime.datetime.now().strftime('%Y%m%d%H%M%S'))
              backup.write_text(content)
              changed=re.sub(r'client_max_body_size\s+[^;]+;', '',content)
              changed=re.sub(r'(server\s*\{)',r'\1\n    client_max_body_size 8m;',changed)
              path.write_text(changed)
              try:subprocess.run(['nginx','-t'],check=True,capture_output=True)
              except Exception:
                  path.write_text(content)
                  raise
              subprocess.run(['systemctl','reload','nginx'],check=True)
          print('XD_GUILD_NGINX_UPLOAD_LIMIT_VERIFIED_8M')
          PYREMOTE
