name: XD Timeweb operations
on:
  push:
    branches: [codex/xd-timeweb-inspect-20261109]
permissions:
  contents: read
concurrency:
  group: xd-timeweb-operations
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Inspect deployed applications without changing them
        env:
          SSH_KEY: ${{ secrets.TIMEWEB_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: "200.165.236.194 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHI/yS3feBcn44XW5y4JDKep+SmRZlR2VxGcL6Rl8KDf"
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" || { echo 'Missing TIMEWEB_SSH_PRIVATE_KEY'; exit 1; }
          test -n "$KNOWN_HOSTS" || { echo 'Missing TIMEWEB_SSH_KNOWN_HOSTS'; exit 1; }
          install -d -m 700 ~/.ssh
          trap 'rm -f ~/.ssh/xd_operations' EXIT
          printf '%s\n' "$SSH_KEY" > ~/.ssh/xd_operations
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/xd_operations ~/.ssh/known_hosts
          ssh -i ~/.ssh/xd_operations -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 root@200.165.236.194 'python3 -' <<'PY'
          import os, pathlib, subprocess, json, urllib.parse, re
          def command(args):
              result=subprocess.run(args,capture_output=True,text=True,timeout=20)
              return result.stdout.strip()
          app=pathlib.Path('/var/www/guild-dashboard-next')
          print('VERSIONS',command(['node','--version']),command(['npm','--version']),command(['pm2','--version']))
          print('SERVER_LOCAL_CHANGES',command(['git','-C',str(app),'status','--porcelain']))
          print('SERVER_DIFF_STATS',command(['git','-C',str(app),'diff','--numstat']))
          pm2=json.loads(command(['pm2','jlist']))
          for process in pm2:
              data=process.get('pm2_env',{})
              print('PROCESS',json.dumps({'name':process.get('name'),'pid':process.get('pid'),'cwd':data.get('pm_cwd'),'script':data.get('pm_exec_path'),'args':data.get('args'),'status':data.get('status'),'port':data.get('PORT'),'database_kind':'sqlite' if str(data.get('DATABASE_URL','')).startswith('file:') else 'unset_or_other','session_secret_set':bool(data.get('SESSION_SECRET'))},ensure_ascii=False))
          for name in ['.env','.env.local','.env.production','.env.production.local']:
              file=app/name
              if file.is_file():
                  keys=[line.split('=',1)[0] for line in file.read_text().splitlines() if '=' in line and not line.lstrip().startswith('#')]
                  print('ENVIRONMENT_FILE_KEYS',name,keys)
          database=app/'prod.db'
          print('DATABASE_FILE',str(database),'bytes',database.stat().st_size,'uid',database.stat().st_uid,'mode',oct(database.stat().st_mode&0o777))
          import sqlite3
          with sqlite3.connect(database.as_uri()+'?mode=ro',uri=True) as db:
              print('DATABASE_TABLES',[row[0] for row in db.execute("select name from sqlite_master where type='table' order by name")])
              print('APPLIED_MIGRATIONS',[row[0] for row in db.execute('select migration_name from _prisma_migrations where finished_at is not null order by migration_name')])
          print('NGINX_APP_CONFIG',pathlib.Path('/etc/nginx/sites-enabled/guild-dashboard').read_text())
          print('CERTBOT_CERTIFICATES',command(['certbot','certificates']))
          print('DISK_SPACE',command(['df','-h','/var/www']))
          print('MEMORY',command(['free','-m']))
          PY
