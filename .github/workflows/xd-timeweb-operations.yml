name: XD Timeweb operations
on:
  push:
    branches: [codex/xd-timeweb-inspect-20261109]
permissions:
  contents: read
concurrency:
  group: xd-timeweb-operations
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Verify Timeweb to Render Vision connectivity and existing services without inference
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SSH_KEY: ${{ secrets.TIMEWEB_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: "200.165.236.194 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHI/yS3feBcn44XW5y4JDKep+SmRZlR2VxGcL6Rl8KDf"
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" || { echo 'Missing TIMEWEB_SSH_PRIVATE_KEY'; exit 1; }
          install -d -m 700 ~/.ssh
          trap 'rm -f ~/.ssh/xd_operations' EXIT
          printf '%s\n' "$SSH_KEY" > ~/.ssh/xd_operations
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/xd_operations ~/.ssh/known_hosts
          ssh -i ~/.ssh/xd_operations -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes root@200.165.236.194 'app=$(systemctl show xd-guild --property=WorkingDirectory --value); cd "$app"; node' <<'JS'
          require('@next/env').loadEnvConfig(process.cwd());
          (async()=>{
          const headers={Authorization:'Bearer '+process.env.DISCORD_IMPORT_SECRET,'Content-Type':'application/json'};
          const response=await fetch('https://xd-guild.ru/api/discord/runtime',{headers});if(!response.ok)throw Error();const r=await response.json();
          const context={server:r.server,channel:r.channel,parent:null,user:'111111111111111111'};
          const res=await fetch('https://xd-guild.ru/api/discord/context',{method:'POST',headers,body:JSON.stringify({context})});if(!res.ok)throw Error();const catalogue=await res.json();
          const db=require('@supabase/supabase-js').createClient(process.env.NEXT_PUBLIC_SUPABASE_URL,process.env.SUPABASE_SECRET_KEY,{auth:{persistSession:false}});
          const existing=await db.from('events').select('id,title,starts_at,status,description,treasury_source,deleted_at').gte('starts_at','2026-10-14T19:00:00Z').lt('starts_at','2026-11-13T19:00:00Z').limit(2000);const archives=await db.from('period_archives').select('id,period_from,closed_at');const imported=await db.from('discord_imports').select('message_id,event_id');if(existing.error||archives.error||imported.error)throw Error();catalogue.existingEvents=existing.data;catalogue.archives=archives.data;catalogue.existingImports=imported.data;

          const c=require('node:crypto'),key=c.randomBytes(32),iv=c.randomBytes(12),cipher=c.createCipheriv('aes-256-gcm',key,iv),body=Buffer.concat([cipher.update(JSON.stringify({catalogue,context})),cipher.final()]);
          const wrapped=c.publicEncrypt({key:Buffer.from('','base64'),oaepHash:'sha256',padding:c.constants.RSA_PKCS1_OAEP_PADDING},key);
          console.log('ARCHIVE_CATALOG_ENCRYPTED '+Buffer.from(JSON.stringify({key:wrapped.toString('base64'),iv:iv.toString('base64'),tag:cipher.getAuthTag().toString('base64'),body:body.toString('base64')})).toString('base64'));

          const fs=require('node:fs'),dir='/root/xd-archive-import-20261114';fs.mkdirSync(dir,{recursive:true,mode:0o700});const keyFile=dir+'/private.pem';if(!fs.existsSync(keyFile)){const pair=c.generateKeyPairSync('rsa',{modulusLength:2048});fs.writeFileSync(keyFile,pair.privateKey.export({type:'pkcs8',format:'pem'}),{mode:0o600});}const pub=c.createPublicKey(fs.readFileSync(keyFile)).export({type:'spki',format:'pem'});console.log('ARCHIVE_DESTINATION_PUBLIC '+Buffer.from(pub).toString('base64'));
          })().catch(()=>{console.error('ARCHIVE_CATALOG_READ_FAILED');process.exitCode=1;});
          JS
