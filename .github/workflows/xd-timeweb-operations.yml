name: XD Timeweb operations
on:
  push:
    branches: [codex/xd-timeweb-inspect-20261109]
permissions:
  contents: read
concurrency:
  group: xd-timeweb-operations
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Verify Timeweb to Render Vision connectivity and existing services without inference
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SSH_KEY: ${{ secrets.TIMEWEB_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: "200.165.236.194 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHI/yS3feBcn44XW5y4JDKep+SmRZlR2VxGcL6Rl8KDf"
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" || { echo 'Missing TIMEWEB_SSH_PRIVATE_KEY'; exit 1; }
          install -d -m 700 ~/.ssh
          trap 'rm -f ~/.ssh/xd_operations' EXIT
          printf '%s\n' "$SSH_KEY" > ~/.ssh/xd_operations
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/xd_operations ~/.ssh/known_hosts
          ssh -i ~/.ssh/xd_operations -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes root@200.165.236.194 'app=$(systemctl show xd-guild --property=WorkingDirectory --value); cd "$app"; node' <<'JS'
          require('@next/env').loadEnvConfig(process.cwd());
          (async()=>{
          const headers={Authorization:'Bearer '+process.env.DISCORD_IMPORT_SECRET,'Content-Type':'application/json'};
          const runtime=await fetch('https://xd-guild.ru/api/discord/runtime',{headers});if(!runtime.ok)throw Error();const r=await runtime.json();
          const response=await fetch('https://xd-guild.ru/api/discord/context',{method:'POST',headers,body:JSON.stringify({context:{server:r.server,channel:r.channel,parent:null,user:'111111111111111111'}})});if(!response.ok)throw Error();const c=await response.json();
          console.log('TARGETED_REGISTERED_NICKNAMES',JSON.stringify(c.members.filter(m=>/паки|стаки|слаки|стяги/iu.test(m.nickname)||m.aliases?.some(a=>/паки|стаки|слаки|стяги/iu.test(a))).map(m=>({nickname:m.nickname,aliases:m.aliases??[]}))));
          const {DatabaseSync}=require('node:sqlite'),db=new DatabaseSync('/var/lib/xd-discord-bot/drafts.sqlite',{readOnly:true});
          for(const row of db.prepare('select payload from drafts order by updated desc limit 5').all()){const d=JSON.parse(row.payload);console.log('TARGETED_RAW_READINGS',JSON.stringify((d.roster?.readings??[]).filter(v=>/па|таки|лаки|тяги/iu.test(v.visible)).map(v=>({visible:v.visible,name:v.name,engine:v.engine,status:v.status,pending:v.pending,suggestions:v.suggestions?.map(m=>m.nickname)}))));}db.close();
          })().catch(()=>{console.log('CATALOG_DIAGNOSIS_FAILED');process.exitCode=1;});
          JS
