name: XD Timeweb operations
on:
  push:
    branches: [codex/xd-timeweb-inspect-20261109]
permissions:
  contents: read
concurrency:
  group: xd-timeweb-operations
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose recent GPT fallbacks without paid requests
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SSH_KEY: ${{ secrets.TIMEWEB_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: "200.165.236.194 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHI/yS3feBcn44XW5y4JDKep+SmRZlR2VxGcL6Rl8KDf"
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" || { echo 'Missing TIMEWEB_SSH_PRIVATE_KEY'; exit 1; }
          install -d -m 700 ~/.ssh
          trap 'rm -f ~/.ssh/xd_operations' EXIT
          printf '%s\n' "$SSH_KEY" > ~/.ssh/xd_operations
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/xd_operations ~/.ssh/known_hosts
          ssh -i ~/.ssh/xd_operations -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes root@200.165.236.194 'cd /var/www/xd-discord-bot/current; node --input-type=commonjs' <<'JS'
          const cp=require('node:child_process'),fs=require('node:fs');
          const lines=cp.execFileSync('journalctl',['-u','xd-discord-bot.service','--since','3 hours ago','-o','cat','--no-pager'],{encoding:'utf8',maxBuffer:10000000}).split('\n');
          for(const l of lines){try{const v=JSON.parse(l);if(['vision_fallback','vision_usage'].includes(v.event))console.log(JSON.stringify({event:v.event,code:v.code,status:v.status,input:v.inputTokens,output:v.outputTokens}));}catch{}}
          const {DatabaseSync}=require('node:sqlite'),db=new DatabaseSync('/var/lib/xd-discord-bot/drafts.sqlite',{readOnly:true});
          console.log('RECENT_VISION_USAGE',JSON.stringify(db.prepare('select day,status,error,input_tokens,output_tokens,cost_micros from vision_usage order by started desc limit 12').all()));db.close();
          (async()=>{
          const db2=new DatabaseSync('/var/lib/xd-discord-bot/drafts.sqlite',{readOnly:true});
          const rows=db2.prepare('select payload from drafts order by updated desc limit 3').all();db2.close();
          const {raidLabelSheets}=await import('file:///var/www/xd-discord-bot/current/src/ocr.mjs');
          const sharp=require('sharp');
          for(const row of rows){const d=JSON.parse(row.payload);console.log('DRAFT_IMAGE_SHAPE',JSON.stringify({step:d.step,attachments:d.attachments?.length,roster:d.rosterImages?.length}));
          for(const a of (d.attachments??[]).filter(a=>d.rosterImages?.includes(a.id))){try{const r=await fetch(a.url,{signal:AbortSignal.timeout(15000)});if(!r.ok){console.log('SOURCE_IMAGE_STATUS',r.status);continue;}const b=Buffer.from(await r.arrayBuffer()),meta=await sharp(b).metadata(),layout=await raidLabelSheets(b);console.log('ROSTER_LAYOUT',JSON.stringify({width:meta.width,height:meta.height,boxes:layout.boxes.length}));}catch(e){console.log('ROSTER_DIAGNOSTIC_ERROR',e.name);}}
          }
          })().catch(()=>{console.log('IMAGE_DIAGNOSIS_FAILED');process.exitCode=1;});
          console.log('BOT_STATE',cp.execFileSync('systemctl',['is-active','xd-discord-bot.service'],{encoding:'utf8'}).trim());
          JS
          cat operations/check-gpt-readiness.cjs | ssh -i ~/.ssh/xd_operations -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes root@200.165.236.194 'app=$(systemctl show xd-guild --property=WorkingDirectory --value); cd "$app"; node'
