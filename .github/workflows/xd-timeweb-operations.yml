name: XD Timeweb operations
on:
  push:
    branches: [codex/xd-timeweb-inspect-20261109]
permissions:
  contents: read
concurrency:
  group: xd-timeweb-operations
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Read-only verification of XD website and Discord services
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SSH_KEY: ${{ secrets.TIMEWEB_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: "200.165.236.194 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHI/yS3feBcn44XW5y4JDKep+SmRZlR2VxGcL6Rl8KDf"
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" || { echo 'Missing TIMEWEB_SSH_PRIVATE_KEY'; exit 1; }
          install -d -m 700 ~/.ssh
          trap 'rm -f ~/.ssh/xd_operations' EXIT
          printf '%s\n' "$SSH_KEY" > ~/.ssh/xd_operations
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/xd_operations ~/.ssh/known_hosts
          ssh -i ~/.ssh/xd_operations -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes root@200.165.236.194 'bash -se' <<'REMOTE'
          set -eu
          app=$(systemctl show xd-guild --property=WorkingDirectory --value)
          cd "$app"
          node <<'JS'
          require('@next/env').loadEnvConfig(process.cwd());
          const names=Object.keys(process.env).filter(k=>/DATABASE_URL|POSTGRES|DB_PASSWORD|SUPABASE_ACCESS_TOKEN/.test(k));
          console.log('DATABASE_CONNECTION_VARIABLE_NAMES',names.join(',') || 'none');
          const fs=require('fs');
          for(const p of ['/root/.config/supabase/access-token','/root/.supabase/access-token','/etc/xd-guild.env']) console.log('CREDENTIAL_FILE_PRESENT',p,fs.existsSync(p));
          JS
          REMOTE
