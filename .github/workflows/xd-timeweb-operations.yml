name: XD Timeweb operations
on:
  push:
    branches: [codex/xd-timeweb-inspect-20261109]
permissions:
  contents: read
concurrency:
  group: xd-timeweb-operations
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Read-only diagnosis of mobile HTTPS and website availability
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SSH_KEY: ${{ secrets.TIMEWEB_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: "200.165.236.194 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHI/yS3feBcn44XW5y4JDKep+SmRZlR2VxGcL6Rl8KDf"
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" || { echo 'Missing TIMEWEB_SSH_PRIVATE_KEY'; exit 1; }
          install -d -m 700 ~/.ssh
          trap 'rm -f ~/.ssh/xd_operations' EXIT
          printf '%s\n' "$SSH_KEY" > ~/.ssh/xd_operations
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/xd_operations ~/.ssh/known_hosts
          ssh -i ~/.ssh/xd_operations -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes root@200.165.236.194 'set -eu; systemctl is-active xd-guild; systemctl is-active xd-discord-bot; systemctl is-active xd-guild-deploy.timer; test "$(cat /var/lib/xd-guild-deploy/deployed)" = "$(cat /var/lib/xd-discord-bot/deployed)"; systemctl show xd-discord-bot --property=NRestarts; echo REFERENCE_UI_SERVICES_VERIFIED_NO_RECOGNITION'
          ssh -i ~/.ssh/xd_operations -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 root@200.165.236.194 'bash -se' <<'REMOTE'
          set -eu
          nginx -t
          df -h /
          free -m
          systemctl show xd-guild --property=NRestarts --property=ActiveState --property=MemoryCurrent
          systemctl list-timers --all --no-pager | grep -E 'certbot|NEXT' || true
          for certificate in /etc/letsencrypt/live/*/fullchain.pem; do
            test -f "$certificate" || continue
            openssl x509 -in "$certificate" -noout -subject -issuer -dates -ext subjectAltName
          done
          curl --fail --silent --show-error --max-time 20 -o /dev/null -w 'VPS_SITE_HTTP=%{http_code} TIME=%{time_total}\n' https://xd-guild.ru/login
          nginx -T 2>/dev/null | grep -E 'listen |server_name |ssl_protocols|ssl_certificate |ssl_trusted_certificate|return 30|proxy_pass'
          journalctl -u xd-guild --since '20 minutes ago' --no-pager | grep -E 'Error:|Timeout|ECONN|out of memory' | sort | uniq -c | head -15 || true
          REMOTE
