name: XD Timeweb operations
on:
  push:
    branches: [codex/xd-timeweb-inspect-20261109]
permissions:
  contents: read
concurrency:
  group: xd-timeweb-operations
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Deploy verified command center to xd-guild.ru
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SSH_KEY: ${{ secrets.TIMEWEB_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: "200.165.236.194 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHI/yS3feBcn44XW5y4JDKep+SmRZlR2VxGcL6Rl8KDf"
        run: |
          set -euo pipefail
          python3 - <<'PYMETA'
          import os
          print('AVAILABLE_MIGRATION_SECRET_NAMES',','.join(k for k in ['SUPABASE_ACCESS_TOKEN','SUPABASE_DB_PASSWORD','DATABASE_URL','SUPABASE_DB_URL'] if os.environ.get(k)))
          PYMETA
          test -n "$SSH_KEY" || { echo 'Missing TIMEWEB_SSH_PRIVATE_KEY'; exit 1; }
          test -n "$KNOWN_HOSTS" || { echo 'Missing TIMEWEB_SSH_KNOWN_HOSTS'; exit 1; }
          install -d -m 700 ~/.ssh
          trap 'rm -f ~/.ssh/xd_operations' EXIT
          printf '%s\n' "$SSH_KEY" > ~/.ssh/xd_operations
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/xd_operations ~/.ssh/known_hosts
          ssh -i ~/.ssh/xd_operations -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 root@200.165.236.194 'bash -se' <<'REMOTE'
          set -euo pipefail
          python3 - <<'PYREMOTE'
          from pathlib import Path
          import os,subprocess
          for name in ['/root/.supabase/access-token','/root/.config/supabase/access-token','/root/.pgpass','/root/.config/supabase/config.json','/var/www/xd-guild-command-center/.env','/var/www/xd-guild-command-center/.env.local']:
            p=Path(name)
            if p.is_file():
              print('DATABASE_CONFIGURATION_FILE_AVAILABLE',name)
              if p.name.startswith('.env'):
                print('DATABASE_CONFIGURATION_KEY_NAMES',','.join(line.split('=',1)[0].strip() for line in p.read_text().splitlines() if '=' in line and any(s in line.split('=',1)[0].upper() for s in ['SUPABASE','DATABASE','POSTGRES'])))
          print('SERVER_DATABASE_ENV_NAMES',','.join(k for k in os.environ if any(s in k for s in ['SUPABASE','DATABASE','POSTGRES','PGPASSWORD'])))
          for binary in ['supabase','psql','docker']:
            r=subprocess.run(['which',binary],capture_output=True,text=True)
            print('AVAILABLE_DATABASE_TOOL',binary,r.returncode==0)
          PYREMOTE
          REMOTE
