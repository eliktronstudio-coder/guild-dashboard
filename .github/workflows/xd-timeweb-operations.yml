name: XD Timeweb operations
on:
  push:
    branches: [codex/xd-timeweb-inspect-20261109]
permissions:
  contents: read
concurrency:
  group: xd-timeweb-operations
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployed GPT Vision and existing services without paid API calls
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SSH_KEY: ${{ secrets.TIMEWEB_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: "200.165.236.194 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHI/yS3feBcn44XW5y4JDKep+SmRZlR2VxGcL6Rl8KDf"
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" || { echo 'Missing TIMEWEB_SSH_PRIVATE_KEY'; exit 1; }
          install -d -m 700 ~/.ssh
          trap 'rm -f ~/.ssh/xd_operations' EXIT
          printf '%s\n' "$SSH_KEY" > ~/.ssh/xd_operations
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/xd_operations ~/.ssh/known_hosts
          cat operations/check-gpt-readiness.cjs | ssh -i ~/.ssh/xd_operations -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes root@200.165.236.194 'app=$(systemctl show xd-guild --property=WorkingDirectory --value); cd "$app"; node'
          python3 operations/scripts/diagnose-performance.py
          python3 operations/scripts/verify-payroll-balances.py
          ssh -i ~/.ssh/xd_operations -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 root@200.165.236.194 'app=$(systemctl show xd-guild --property=WorkingDirectory --value); cd "$app"; node' <<'JS'
          require('@next/env').loadEnvConfig(process.cwd());
          (async()=>{
            if(process.env.APP_ORIGIN!=='https://xd-guild.ru')throw new Error('Unexpected origin');
            const visionFs=require('node:fs'),cp=require('node:child_process');
            const bot='/var/www/xd-discord-bot/current';
            if(!visionFs.existsSync(bot+'/src/vision.mjs')||!visionFs.readFileSync(bot+'/src/index.mjs','utf8').includes('createVisionRecognizer'))throw Error('GPT integration missing');
            const unit=cp.execFileSync('systemctl',['cat','xd-discord-bot.service'],{encoding:'utf8'});
            if(!unit.includes('EnvironmentFile=/etc/xd-discord-bot.env'))throw Error('Worker environment-file wiring missing');
            const pid=cp.execFileSync('systemctl',['show','xd-discord-bot.service','--property=MainPID','--value'],{encoding:'utf8'}).trim();
            if(!/^[1-9][0-9]*$/.test(pid))throw Error('No worker process');
            const runningEnv=Object.fromEntries(visionFs.readFileSync('/proc/'+pid+'/environ','utf8').split('\0').filter(x=>x.includes('=')).map(x=>{const i=x.indexOf('=');return [x.slice(0,i),x.slice(i+1)];}));
            const {visionConfig}=await import('file://'+bot+'/src/vision.mjs');
            const config=visionConfig(runningEnv);
            console.log('GPT_VISION_DEPLOYED_NO_PAID_TEST',JSON.stringify({workerKeyConfigured:Boolean(runningEnv.OPENAI_API_KEY),model:config.model,dailyLimit:config.daily,concurrency:config.concurrent,monthlyUSD:config.monthlyMicros/1e6,environmentFile:true}));
            const visionDb=new (require('node:sqlite').DatabaseSync)('/var/lib/xd-discord-bot/drafts.sqlite',{readOnly:true});
            if(visionDb.prepare("select name from sqlite_master where name in ('vision_usage','vision_cache')").all().length!==2)throw Error('Persistent GPT budget/cache missing');
            visionDb.close();

            if(!require('node:fs').readFileSync('src/lib/player-class.ts','utf8').includes('"Хил"'))throw Error('Healer class missing');
            const healerRegistration=await fetch('https://xd-guild.ru/login?mode=register');
            const healerHtml=await healerRegistration.text();
            if(!healerRegistration.ok||!healerHtml.includes('value="Хил"'))throw Error('Healer registration option missing');
            console.log('HEALER_REGISTRATION_AND_ONE_TIME_SELECTION_DEPLOYED');
            const dateFs=require('node:fs');
            if(dateFs.readFileSync('/var/www/xd-discord-bot/current/src/workflow.mjs','utf8').includes('new Date(m.joined_at).getTime() <= message.createdTimestamp')||!dateFs.existsSync('supabase/migrations/202611120040_activity_registration_date.sql')||dateFs.readFileSync('src/lib/activity-workspace.ts','utf8').includes('игрока, вступившего позже даты активности'))throw Error('Historical roster fix missing');
            console.log('ACTIVITY_AND_DISCORD_ROSTERS_IGNORE_WEBSITE_REGISTRATION_DATE');
            const botFs=require('node:fs'),botRoot='/var/www/xd-discord-bot/current/';
            if(!botFs.readFileSync(botRoot+'src/ocr.mjs','utf8').includes('refineRosterWords')||!botFs.readFileSync(botRoot+'src/workflow.mjs','utf8').includes('confirmedExamples')||!botFs.existsSync(botRoot+'tests/ocr-refinement.test.mjs'))throw Error('Nickname OCR refinement missing');
            console.log('CELL_RETRY_AND_CONFIRMED_ROSTER_LEARNING_DEPLOYED');
            const fsClass=require('node:fs');
            const classPrompt=fsClass.readFileSync('src/components/members/player-class-prompt.tsx','utf8');
            if(!classPrompt.includes('setSelected')||!classPrompt.includes('savePlayerClass')||!fsClass.readFileSync('src/components/shell.tsx','utf8').includes('class_selected_at')||!fsClass.readFileSync('src/app/actions.ts','utf8').includes('game_class: input.playerClass'))throw Error('Required player class code missing');
            const registration=await fetch('https://xd-guild.ru/login?mode=register');
            const registrationHtml=await registration.text();
            if(!registration.ok||!registrationHtml.includes('name="playerClass"')||!['Лучник','Маг','Милик','Танк'].every(c=>registrationHtml.includes(c)))throw Error('Registration class selector unavailable');
            console.log('REQUIRED_CLASS_REGISTRATION_AND_PERSISTENT_ONE_TIME_PROMPT_DEPLOYED');
            const accessSource=require('node:fs').readFileSync('src/lib/access.ts','utf8');
            const recoverySource=require('node:fs').readFileSync('src/app/error.tsx','utf8');
            const shellSource=require('node:fs').readFileSync('src/components/shell.tsx','utf8');
            if(!accessSource.includes('new Map<string, Promise<boolean>>')||accessSource.includes('redirect("/setup?problem=database")')||!recoverySource.includes('router.refresh()')||!shellSource.includes('prefetch={false}'))throw Error('Performance recovery code missing');
            const recovery=await fetch('https://xd-guild.ru/setup?problem=database');
            if(!recovery.ok||!(await recovery.text()).includes('Повторить загрузку'))throw Error('Recovery page unavailable');
            console.log('PERMISSION_DEDUPLICATION_AND_DATABASE_RECOVERY_DEPLOYED');
            const warehousePageSource=require('node:fs').readFileSync('src/app/treasury/page.tsx','utf8');
            const warehouseActionSource=require('node:fs').readFileSync('src/app/treasury/inventory-actions.ts','utf8');
            if(!warehousePageSource.includes('inventory-columns')||!warehousePageSource.includes('Общий инвентарь')||!warehousePageSource.includes('Инвентарь ХД')||!warehouseActionSource.includes('transfer_inventory_to_xd'))throw Error('Two-inventory workspace missing');
            console.log('GENERAL_AND_XD_PANES_WITH_QUANTITY_TRANSFER_DEPLOYED');
            const auctionActionSource=require('node:fs').readFileSync('src/app/treasury/inventory-actions.ts','utf8');
            if(!auctionActionSource.includes('sell_inventory_auction_now')||!auctionActionSource.includes('sell_pending_auction_now')||!require('node:fs').existsSync('src/components/treasury/settle-pending-auctions.tsx'))throw Error('Instant auction handlers missing');
            console.log('INSTANT_AUCTION_SALES_AND_AUTHENTICATED_LEGACY_CONVERSION_DEPLOYED');
            const fs=require('node:fs');
            const inventorySource=fs.readFileSync('src/components/treasury/inventory.tsx','utf8');
            if(!inventorySource.includes('inventory-bag')||!inventorySource.includes('listInventoryAuction'))throw Error('Inventory workspace missing');
            const descriptions=JSON.parse(fs.readFileSync('src/data/drop-descriptions.json','utf8'));
            if(Object.keys(descriptions).length<75||!Object.values(descriptions).every(x=>x.url.startsWith('https://archeagecodex.com/ru/item/')&&x.text.length>30))throw Error('Codex descriptions missing');
            console.log('COMPACT_INVENTORY_AUCTION_ACTIONS_AND_75_CODEX_DESCRIPTIONS_DEPLOYED');
            const formSource=require('node:fs').readFileSync('src/components/activities/activity-form.tsx','utf8');
            const detailSource=require('node:fs').readFileSync('src/app/events/[id]/page.tsx','utf8');
            if(formSource.includes('Подтверждаю состав:')||detailSource.includes('Подтвердить весь отчёт'))throw Error('Manual roster confirmation still present');
            console.log('MANUAL_ROSTER_CONFIRMATION_REMOVED_FROM_LIVE_RELEASE');
            const rolesSource=require('node:fs').readFileSync('src/lib/members.ts','utf8');
            if(!rolesSource.includes('guild_master')||!rolesSource.includes('tablemaker'))throw Error('Role selector source missing');
            console.log('GUILD_MASTER_AND_TABLEMAKER_RELEASE_AVAILABLE');
            const manifest=require('./.next/server/app-paths-manifest.json');
            for(const path of ['/admin/participation/page','/events/[id]/delete/page','/events/[id]/claim-image/route','/members/[id]/page','/treasury/page','/rb-purchase/page','/archive/page','/archive/export/route'])if(!manifest[path])throw Error('Missing payroll route');
            for(const path of ['/admin/participation','/members','/rb-purchase','/archive']){
              const response=await fetch('https://xd-guild.ru'+path,{redirect:'manual'});
              const text=response.status===200?await response.text():'';
              const redirect=[303,307,308].includes(response.status)&&response.headers.get('location')?.includes('/login');
              const streamedRedirect=response.status===200&&text.includes('NEXT_REDIRECT')&&text.includes('/login')&&!text.includes('/claim-image?claim=');
              if(!redirect&&!streamedRedirect)throw Error('Private route access check failed');
            }
            console.log('RB_PURCHASE_ROUTE_READY_AND_GUEST_ACCESS_REQUIRES_LOGIN');
            const r=await fetch('https://xd-guild.ru/api/discord/runtime',{headers:{Authorization:'Bearer '+process.env.DISCORD_IMPORT_SECRET}});
            if(!r.ok)throw Error('Discord bridge unavailable');
            const v=await r.json();console.log('LIVE_DISCORD_RUNTIME',JSON.stringify({configured:v.enabled}));
            if(v.enabled){
              const context=await fetch('https://xd-guild.ru/api/discord/context',{method:'POST',headers:{Authorization:'Bearer '+process.env.DISCORD_IMPORT_SECRET,'Content-Type':'application/json'},body:JSON.stringify({context:{server:v.server,channel:v.channel,parent:null,user:'111111111111111111'}})});
              if(!context.ok)throw Error('Channel import requires unexpected user binding');
              console.log('CHANNEL_IMPORT_AVAILABLE_WITHOUT_USER_BINDING');
              const catalog=await context.json();
              if(!Array.isArray(catalog.members)||!catalog.members.every(m=>typeof m.id==='string'&&Array.isArray(m.aliases)))throw Error('Registered character aliases missing');
              console.log('LIVE_REGISTERED_MEMBERS_WITH_CHARACTER_ALIASES_VERIFIED');
              const me=await fetch('https://discord.com/api/v10/users/@me',{headers:{Authorization:'Bot '+v.token},signal:AbortSignal.timeout(10000)});
              if(me.ok){const identity=await me.json();console.log('DISCORD_ID_CONFIGURATION',JSON.stringify({server_is_bot_id:v.server===identity.id,channel_is_bot_id:v.channel===identity.id}));}
              const guilds=await fetch('https://discord.com/api/v10/users/@me/guilds',{headers:{Authorization:'Bot '+v.token},signal:AbortSignal.timeout(10000)});
              if(guilds.ok){const rows=await guilds.json();console.log('DISCORD_GUILD_MEMBERSHIP',JSON.stringify({count:rows.length,configured_server_joined:rows.some(g=>g.id===v.server)}));}
              for(const [label,path] of [['SERVER','/guilds/'+v.server],['CHANNEL','/channels/'+v.channel]]){
                const res=await fetch('https://discord.com/api/v10'+path,{headers:{Authorization:'Bot '+v.token},signal:AbortSignal.timeout(10000)});console.log('DISCORD_ACCESS_'+label,res.status);
              }
            }
            const {DatabaseSync}=require('node:sqlite'),db=new DatabaseSync('/var/lib/xd-discord-bot/drafts.sqlite',{readOnly:true});
            const tables=db.prepare("select name from sqlite_master where type='table' and name in ('nickname_names','nickname_examples','nickname_confirmations')").all();if(tables.length!==3)throw Error('Nickname memory tables unavailable');
            const names=db.prepare('select count(*) as n from nickname_names').get().n;db.close();console.log('PERSISTENT_NICKNAME_MEMORY_READY',JSON.stringify({tables:tables.length,names}));
            const denied=await fetch('https://xd-guild.ru/api/discord/runtime');if(denied.status!==401)throw Error('Missing bridge authentication');
            console.log('UNAUTHENTICATED_DISCORD_API_DENIED');

          })().catch(()=>{console.error('Registry verification failed');process.exitCode=1;});
          JS
          ssh -i ~/.ssh/xd_operations -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes root@200.165.236.194 'set -eu; systemctl is-active xd-guild; systemctl is-active xd-discord-bot; systemctl is-active xd-guild-deploy.timer; test "$(cat /var/lib/xd-guild-deploy/deployed)" = "$(cat /var/lib/xd-discord-bot/deployed)"; cat /var/lib/xd-discord-bot/deployed; systemctl show xd-discord-bot --property=User --property=NRestarts; stat -c "%a %U" /etc/xd-discord-bot.env'
