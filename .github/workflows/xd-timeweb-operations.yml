name: XD Timeweb operations
on:
  push:
    branches: [codex/xd-timeweb-inspect-20261109]
permissions:
  contents: read
concurrency:
  group: xd-timeweb-operations
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Verify populated activity and drop registries without changing data
        env:
          SSH_KEY: ${{ secrets.TIMEWEB_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: "200.165.236.194 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHI/yS3feBcn44XW5y4JDKep+SmRZlR2VxGcL6Rl8KDf"
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" || { echo 'Missing TIMEWEB_SSH_PRIVATE_KEY'; exit 1; }
          install -d -m 700 ~/.ssh
          trap 'rm -f ~/.ssh/xd_operations' EXIT
          printf '%s\n' "$SSH_KEY" > ~/.ssh/xd_operations
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/xd_operations ~/.ssh/known_hosts
          ssh -i ~/.ssh/xd_operations -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 root@200.165.236.194 'app=$(systemctl show xd-guild --property=WorkingDirectory --value); cd "$app"; node' <<'JS'
          require('@next/env').loadEnvConfig(process.cwd());
          (async()=>{
            if(process.env.APP_ORIGIN!=='https://xd-guild.ru')throw new Error('Unexpected origin');
            for(const table of ['guild_activity_banners','guild_drop_registry']){
              const base=process.env.NEXT_PUBLIC_SUPABASE_URL+'/rest/v1/'+table+'?select=id&guild_id=eq.00000000-0000-4000-8000-000000000001&limit=0';
              for(const [label,filter] of [['ALL',''],['WITH_PHOTOS','&photo=neq.']]){
                const r=await fetch(base+filter,{method:'HEAD',headers:{apikey:process.env.SUPABASE_SECRET_KEY,Prefer:'count=exact'},signal:AbortSignal.timeout(15000)});
                if(!r.ok)throw new Error('Registry API check failed');
                console.log('LIVE_REGISTRY',table,label,r.status,r.headers.get('content-range'));
              }
            }
          })().catch(()=>{console.error('Registry verification failed');process.exitCode=1;});
          JS
