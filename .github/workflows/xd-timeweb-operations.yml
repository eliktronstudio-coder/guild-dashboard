name: XD Timeweb operations
on:
  push:
    branches: [codex/xd-timeweb-inspect-20261109]
permissions:
  contents: read
concurrency:
  group: xd-timeweb-operations
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: baab65debdaff81b71b74c6daca01d54d5d51c35
      - name: Activate administrator drop registry on production Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SSH_KEY: ${{ secrets.TIMEWEB_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: "200.165.236.194 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHI/yS3feBcn44XW5y4JDKep+SmRZlR2VxGcL6Rl8KDf"
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Missing SUPABASE_ACCESS_TOKEN'; exit 1; }
          test -n "$SSH_KEY" || { echo 'Missing TIMEWEB_SSH_PRIVATE_KEY'; exit 1; }
          test -n "$KNOWN_HOSTS" || { echo 'Missing TIMEWEB_SSH_KNOWN_HOSTS'; exit 1; }
          install -d -m 700 ~/.ssh
          trap 'rm -f ~/.ssh/xd_operations' EXIT
          printf '%s\n' "$SSH_KEY" > ~/.ssh/xd_operations
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/xd_operations ~/.ssh/known_hosts
          python3 - <<'PYRUN'
          import os,json,subprocess,urllib.request,urllib.error,urllib.parse,re,pathlib
          remote='app=$(systemctl show xd-guild --property=WorkingDirectory --value); cd "$app"; node'
          source="""
          require('@next/env').loadEnvConfig(process.cwd());
          console.log(JSON.stringify({origin:process.env.APP_ORIGIN,url:process.env.NEXT_PUBLIC_SUPABASE_URL}));
          """
          result=subprocess.run(['ssh','-i',os.path.expanduser('~/.ssh/xd_operations'),'-o','BatchMode=yes','-o','IdentitiesOnly=yes','-o','StrictHostKeyChecking=yes','-o','ConnectTimeout=20','root@200.165.236.194',remote],input=source,text=True,capture_output=True,timeout=45,check=True)
          target=json.loads(result.stdout)
          if target.get('origin')!='https://xd-guild.ru':raise SystemExit('Unexpected target origin; no migration applied.')
          url=urllib.parse.urlsplit(target['url']);ref=url.hostname.removesuffix('.supabase.co')
          if url.scheme!='https' or not url.hostname.endswith('.supabase.co') or not re.fullmatch('[a-z0-9]{20}',ref):raise SystemExit('Unexpected Supabase project URL; no migration applied.')
          def query(sql):
            request=urllib.request.Request('https://api.supabase.com/v1/projects/'+ref+'/database/query',data=json.dumps({'query':sql}).encode(),headers={'Authorization':'Bearer '+os.environ['SUPABASE_ACCESS_TOKEN'],'Content-Type':'application/json'},method='POST')
            try:
              with urllib.request.urlopen(request,timeout=90) as response:return json.load(response)
            except urllib.error.HTTPError as error:
              print('SUPABASE_SQL_HTTP_ERROR',error.code)
              print(error.read().decode()[:1200])
              raise SystemExit(1)
          before=query("select to_regclass('public.guild_drop_registry') is not null as registry_exists, to_regclass('public.memberships') is not null as memberships_exists")
          print('PRODUCTION_SCHEMA_PREFLIGHT',json.dumps(before))
          if not isinstance(before,list) or not before or before[0].get('memberships_exists') is not True:raise SystemExit('Production schema mismatch; no migration applied.')
          migration=pathlib.Path('apps/web/supabase/migrations/202611090019_drop_registry.sql').read_text()
          query(migration)
          print('DROP_REGISTRY_MIGRATION_APPLIED')
          verified=query("""
          select
            (select relrowsecurity from pg_class where oid='public.guild_drop_registry'::regclass) as rls_enabled,
            to_regprocedure('public.save_drop_registry(uuid,uuid,integer,text,text,bigint)') is not null as save_rpc_ready,
            to_regprocedure('public.delete_drop_registry(uuid,uuid,integer)') is not null as delete_rpc_ready,
            (select count(*) from public.role_permissions rp join public.roles r on r.id=rp.role_id where rp.permission='drops.manage' and r.code in ('owner','admin')) as admin_role_grants,
            (select count(*) from public.role_permissions rp join public.roles r on r.id=rp.role_id where rp.permission='drops.manage' and r.code not in ('owner','admin')) as other_role_grants
          """)
          print('DROP_REGISTRY_VERIFICATION',json.dumps(verified))
          row=verified[0]
          if not(row['rls_enabled'] and row['save_rpc_ready'] and row['delete_rpc_ready'] and row['admin_role_grants']>=2 and row['other_role_grants']==0):raise SystemExit('Registry schema verification failed')
          PYRUN
