name: XD Timeweb operations
on:
  push:
    branches: [codex/xd-timeweb-inspect-20261109]
permissions:
  contents: read
concurrency:
  group: xd-timeweb-operations
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy audited salary statements and guild join dates
        env:
          SSH_KEY: ${{ secrets.TIMEWEB_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: "200.165.236.194 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHI/yS3feBcn44XW5y4JDKep+SmRZlR2VxGcL6Rl8KDf"
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" || { echo 'Missing TIMEWEB_SSH_PRIVATE_KEY'; exit 1; }
          install -d -m 700 ~/.ssh
          trap 'rm -f ~/.ssh/xd_operations' EXIT
          printf '%s\n' "$SSH_KEY" > ~/.ssh/xd_operations
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/xd_operations ~/.ssh/known_hosts
          ssh -i ~/.ssh/xd_operations -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 root@200.165.236.194 'bash -se' <<'REMOTE'
          set -euo pipefail
          exec 9>/var/lib/xd-guild-deploy/lock
          flock -w 180 9
          cd /var/www/xd-guild-command-center
          test "$(git branch --show-current)" = codex/xd-foundation-20261031
          test -z "$(git status --porcelain)"
          git fetch origin codex/xd-foundation-20261031
          expected=fde83a12cd030a956fa0ace9d699a4e54dc48d0b
          test "$(git rev-parse origin/codex/xd-foundation-20261031)" = "$expected"
          df -h /
          git merge --ff-only "$expected"
          if [ "$(cat /var/lib/xd-guild-deploy/deployed)" != "$expected" ]; then
            if [ "$(df -Pk / | awk 'NR==2 { print $4 }')" -lt 2621440 ]; then
              inactive=/var/www/xd-guild-releases/f07a0af-20261111192911
              active_before=$(systemctl show xd-guild --property=WorkingDirectory --value)
              case "$active_before" in "$inactive"/*) exit 1 ;; esac
              test -f "$inactive/apps/web/package-lock.json"
              if [ -d "$inactive/apps/web/node_modules" ]; then
                rm -rf -- "$inactive/apps/web/node_modules"
                echo ONLY_OLD_INACTIVE_REINSTALLABLE_DEPENDENCIES_RECLAIMED
              fi
            fi
            test "$(df -Pk / | awk 'NR==2 { print $4 }')" -gt 2097152
            bash scripts/deploy-timeweb.sh
            git rev-parse HEAD > /var/lib/xd-guild-deploy/deployed
          fi
          test "$(cat /var/lib/xd-guild-deploy/deployed)" = "$expected"
          app=$(systemctl show xd-guild --property=WorkingDirectory --value)
          grep -q 'export const PERIOD_CLOSING_ENABLED = false;' "$app/src/lib/config.ts"
          grep -q 'lock_salary_statement' "$app/src/app/payments/salary/actions.ts"
          test -f "$app/src/app/payments/statements/[id]/page.tsx"
          test -f "$app/src/app/payments/history/page.tsx"
          grep -q 'Прайм и Мини РБ рассчитываются отдельно' "$app/src/app/members/page.tsx"
          test "$(cat /var/lib/xd-discord-bot/deployed)" = "$expected"
          systemctl is-active xd-guild
          systemctl is-active xd-discord-bot
          curl --fail --silent --show-error --max-time 20 -o /dev/null https://xd-guild.ru/login
          echo SALARY_STATEMENT_RELEASE_AND_SERVICES_VERIFIED
          REMOTE
