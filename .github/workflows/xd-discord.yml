name: XD Discord bot
on:
  pull_request:
    paths: ['apps/discord-bot/**', '.github/workflows/xd-discord.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/discord-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/discord-bot/package-lock.json
      - run: npm ci
      - run: npm test
      - run: node --check src/index.mjs
